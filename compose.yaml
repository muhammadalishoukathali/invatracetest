name: invatrace

services:
  db:
    build:
      context: ./infrastructure/postgis
    environment:
      POSTGRES_DB: invatrace
      POSTGRES_USER: invatrace
      POSTGRES_PASSWORD: invatrace
    volumes:
      - invatrace-postgres:/var/lib/postgresql/data
    ports:
      # Loopback-only access supports the documented Windows one-off importer
      # through an SSH reverse tunnel without exposing Postgres to the LAN.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invatrace -d invatrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - invatrace-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - invatrace-minio:/data
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
        mc mb --ignore-existing local/invatrace-private &&
        mc anonymous set none local/invatrace-private
    restart: "no"

  # Backend image build - context is the REPO ROOT so the Dockerfile can COPY
  # both backend/ and shared/catalogue/ in one image. This must match how
  # Render builds the image (render.yaml -> dockerfilePath: ./backend/Dockerfile
  # with default docker context = repo root). If you change one, change both,
  # or a green local build will still crash on Render.
  migrate:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
      target: test-runtime
    environment: &backend-environment
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://invatrace:invatrace@db:5432/invatrace
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      JWT_SECRET: development-only-jwt-secret-change-me
      CREDENTIAL_HASH_KEY: development-only-credential-key-change-me
      LOCATION_PRIVACY_KEY: development-only-location-key-change-me
      # The integration suite intentionally submits several reports and is
      # designed to be rerunnable against the persistent local stack. Keep
      # production defaults unchanged while preventing prior local runs from
      # exhausting the shared-IP window for later verification runs.
      REPORT_CREATE_BURST_LIMIT: 10000
      REPORT_CREATE_IP_BURST_LIMIT: 10000
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: invatrace-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      E1_MODEL_VERSIONS: oe_v4_31class_web_fp16
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: *backend-build
    environment: *backend-environment
    command: ["python", "-m", "app.cli", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-demo:
    # Optional acceptance-criteria demo dataset. Runs on demand:
    #   docker compose --profile demo up --build seed-demo
    # Idempotent - re-running it against a populated DB is a no-op.
    profiles: ["demo"]
    build: *backend-build
    environment: *backend-environment
    command: ["python", "-m", "app.cli", "seed-acceptance-demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: *backend-build
    environment:
      <<: *backend-environment
      REPORT_CREATE_BURST_LIMIT: 10
      REPORT_CREATE_IP_BURST_LIMIT: 30
    volumes:
      # The read-only repository mount makes the documented `docker compose
      # run --rm api pytest` exercise the same source, contracts, and audited
      # data files as the host checkout without changing the production image.
      - .:/service:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: *backend-build
    environment: *backend-environment
    command: ["python", "-m", "app.cli", "worker"]
    # The image healthcheck probes the HTTP API, but this service is a CLI
    # worker and intentionally exposes no HTTP port.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  upload-cleanup:
    build: *backend-build
    environment: *backend-environment
    command: ["python", "-m", "app.cli", "cleanup-worker"]
    # The image healthcheck probes the HTTP API, but this service is a CLI
    # worker and intentionally exposes no HTTP port.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  invatrace-postgres:
  invatrace-redis:
  invatrace-minio:
