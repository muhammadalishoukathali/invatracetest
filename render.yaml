# AC Iteration 1 P11 - Render.com deploy blueprint for InvaTrace.
#
# Two services here: the FastAPI backend (invatrace-api) and the Vite PWA
# (invatrace-web). Postgres + Redis are NOT declared as Render services
# because Render's managed Postgres does not include PostGIS; provision
# both externally (Neon / Supabase / self-hosted for Postgres with the
# postgis extension enabled, Upstash / Render Redis for Redis) and wire
# DATABASE_URL / REDIS_URL through the Render dashboard.
#
# On first deploy - after both services are created - set the shared
# secrets in each service's env panel (marked `sync: false` below).
# Schema migrations and reference-data load run in the container
# entrypoint (backend/docker-entrypoint.sh) on every start, so no
# out-of-band step is needed after the first push.

services:
  - type: web
    name: invatrace-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/live
    # AC 1.2.1 - migrations and reference-data load run in the container
    # entrypoint (backend/docker-entrypoint.sh) so a fresh free-tier deploy
    # does not depend on Render's paid-only preDeployCommand step.
    envVars:
      - key: APP_ENV
        value: production
      # This deploy is the AC-demonstration environment for mentors, so the
      # acceptance-criteria demo dataset (profiles across every trust tier,
      # reports covering every status, sightings, notifications, adopted
      # areas, recovery codes, place-sighting evidence) is loaded on every
      # boot. Idempotent - re-deploys are no-ops. Flip to "false" (or delete
      # the env var) if this service ever hosts a real production DB with
      # genuine user data.
      - key: SEED_ACCEPTANCE_DEMO
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_HASH_KEY
        generateValue: true
      - key: LOCATION_PRIVACY_KEY
        generateValue: true
      - key: CORS_ORIGINS
        # Both published frontend origins serve the same production bundle.
        # Keep this explicit so a stale dashboard value cannot leave the
        # Cloudflare Pages site unable to start or restore private access.
        value: https://invatrace-web.onrender.com,https://invatrace.pages.dev
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: invatrace-photos
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Free-tier deploy has no separate worker service; API process runs
      # verification + cleanup as background asyncio tasks.
      - key: RUN_WORKERS_IN_API
        value: "true"
      # AC 2.3.3 - the actual master switch. Pydantic's default is already
      # true, but a stale dashboard override once flipped this to false in
      # prod and every rate check silently no-op'd - testers uploaded past
      # the AC cap without hitting a single 429. Pinned here so the blueprint
      # always wins over anything sitting in the dashboard.
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # AC 2.3.3 - env-backed sliding submission rate limits. Pinned to the
      # spec numbers (10 per profile / 30 per IP / 10-minute window) so the
      # deployed config matches what the AC actually says. Nothing here bans
      # an account, the counter just ages out on its own.
      - key: REPORT_CREATE_BURST_LIMIT
        value: "10"
      - key: REPORT_CREATE_IP_BURST_LIMIT
        value: "30"
      - key: REPORT_CREATE_BURST_WINDOW_SECONDS
        value: "600"
      # Outstanding presigned-URL quota per profile. Raised from the code
      # default (10) because an abandoned camera capture eats a grant slot
      # for the full UPLOAD_URL_TTL_SECONDS (default 15 min), and testers
      # who retry the camera flow burn through 10 slots quickly.
      - key: UPLOAD_ACTIVE_GRANTS_PER_PROFILE
        value: "25"
      # AC Iteration 1 P7 - single 300 m GPS accuracy policy. Kept explicit
      # in production so a config drift is caught at deploy review rather
      # than surprising a reporter with a rescan whose threshold is not
      # documented in the app UI.
      - key: SCREENING_LOCATION_ACCURACY_MAX_M
        value: "250"
      # AC Iteration 1 P4 - duplicate detection must stay on in prod.
      # Explicit so an operator toggling it in a dev env cannot leak the
      # flag through a rebased branch.
      - key: SCREENING_DISABLE_DUPLICATE_CHECK
        value: "false"
      # PlantNet cross-check for the on-device model's Unknown results.
      # sync: false so the key is set in the Render dashboard, never
      # committed. Feature stays inert until this is provided; the frontend
      # just shows the plain "Not Sure" result in that case.
      - key: PLANTNET_API_KEY
        sync: false
      - key: PLANTNET_PROJECT
        value: "all"
      # Accept the retired PULIH bundle alongside the current Student33
      # release while any client PWA still ships the older model.
      - key: E1_MODEL_VERSIONS
        value: invatrace-student33-tinyvit5m-320-fp16,oe_v4_31class_web_fp16

  # Verification + cleanup workers run in-process inside invatrace-api on the
  # free plan (see RUN_WORKERS_IN_API above). On paid plans, add background
  # worker services here and flip RUN_WORKERS_IN_API to "false".

  # AC Phase 5 - frontend PWA static site. Vite build output goes to dist/,
  # served with SPA rewrites so the React Router owns every non-asset URL.
  # VITE_API_BASE_URL must point at the invatrace-api service; every VITE_
  # var below bakes into the bundle so nothing here should be secret.
  - type: web
    name: invatrace-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # AC Iteration 1 P11 - long-lived caching for hashed Vite assets, and
    # a no-store for the service-worker entry point so an updated release
    # replaces the shell instead of a stale copy sitting in a browser cache.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Set this in the Render dashboard to the full https URL of the
      # invatrace-api service (e.g. https://invatrace-api.onrender.com).
      # Cannot be auto-derived from fromService because hostport omits the
      # scheme and Vite requires a full URL for the API client.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ENABLE_MOCKS
        value: "false"
      - key: VITE_ENABLE_FAKE_MODEL
        value: "false"
      - key: VITE_ENABLE_REAL_MODEL
        value: "true"
      - key: VITE_RELEASE_ID
        sync: false
      - key: VITE_MODEL_MANIFEST_URL
        value: /models/model-manifest.json
